  <text x="898.0" y="348.0" font-size="9.5" fill="#5B6B7C" text-anchor="middle" font-weight="normal">rec</text>
  <rect x="991.0" y="336.0" width="26.0" height="16.0" rx="3" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1"/>
  <text x="1004.0" y="348.0" font-size="9.5" fill="#5B6B7C" text-anchor="middle" font-weight="normal">rec</text>
  <rect x="1037.0" y="336.0" width="26.0" height="16.0" rx="3" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1"/>
  <text x="1050.0" y="348.0" font-size="9.5" fill="#5B6B7C" text-anchor="middle" font-weight="normal">rec</text>
  <rect x="1143.0" y="336.0" width="26.0" height="16.0" rx="3" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1"/>
  <text x="1156.0" y="348.0" font-size="9.5" fill="#5B6B7C" text-anchor="middle" font-weight="normal">rec</text>
  <rect x="1189.0" y="336.0" width="26.0" height="16.0" rx="3" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1"/>
  <text x="1202.0" y="348.0" font-size="9.5" fill="#5B6B7C" text-anchor="middle" font-weight="normal">rec</text>
  <rect x="1235.0" y="336.0" width="26.0" height="16.0" rx="3" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1"/>
  <text x="1248.0" y="348.0" font-size="9.5" fill="#5B6B7C" text-anchor="middle" font-weight="normal">rec</text>
  <text x="40.0" y="380.0" font-size="13.5" fill="#1B2430" text-anchor="start" font-weight="normal">• Every node stores keys AND records.</text>
  <text x="740.0" y="380.0" font-size="13.5" fill="#1B2430" text-anchor="start" font-weight="normal">• Internal nodes store routing keys only.</text>
  <text x="40.0" y="402.0" font-size="13.5" fill="#1B2430" text-anchor="start" font-weight="normal">• Each key appears exactly once.</text>
  <text x="740.0" y="402.0" font-size="13.5" fill="#1B2430" text-anchor="start" font-weight="normal">• Separator keys are copies (30, 50 appear twice).</text>
  <text x="40.0" y="424.0" font-size="13.5" fill="#1B2430" text-anchor="start" font-weight="normal">• A search can stop early at an internal node.</text>
  <text x="740.0" y="424.0" font-size="13.5" fill="#1B2430" text-anchor="start" font-weight="normal">• Every search ends at a leaf — predictable cost.</text>
  <text x="40.0" y="446.0" font-size="13.5" fill="#1B2430" text-anchor="start" font-weight="normal">• Range scan = in-order traversal: climb up and down</text>
  <text x="740.0" y="446.0" font-size="13.5" fill="#1B2430" text-anchor="start" font-weight="normal">• Range scan = find first leaf, then follow next</text>
  <text x="53.0" y="468.0" font-size="13.5" fill="#1B2430" text-anchor="start" font-weight="normal">the tree between neighbouring keys.</text>
  <text x="753.0" y="468.0" font-size="13.5" fill="#1B2430" text-anchor="start" font-weight="normal">pointers. No climbing back up.</text>
  <text x="40.0" y="490.0" font-size="13.5" fill="#1B2430" text-anchor="start" font-weight="normal">• Fewer keys fit per node page (records take space).</text>
  <text x="740.0" y="490.0" font-size="13.5" fill="#1B2430" text-anchor="start" font-weight="normal">• More keys per page → higher fan-out → shorter tree.</text>
  <text x="34.0" y="530.0" font-size="14.5" fill="#1B2430" text-anchor="start" font-weight="600">This is why relational databases and cloud key-value stores build their indexes as B+ trees.</text>
</svg>
