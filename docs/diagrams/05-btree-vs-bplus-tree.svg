  <text x="34" y="42" font-size="23" font-weight="600" fill="#1B2430">B-tree vs B+ tree holding the same seven records</text>
  <text x="34" y="66" font-size="14.5" fill="#5B6B7C">Both are balanced multi-way search trees of order 4. The difference is where the data lives.</text>
